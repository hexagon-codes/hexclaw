name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

jobs:
  image:
    name: Build checked revision
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      vars.HEXCLAW_DEPLOY_ENABLED == 'true' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    concurrency:
      group: deploy-image-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: true
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        id: build
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ghcr.io/hexagon-codes/hexclaw:sha-${{ github.event.workflow_run.head_sha }}
          labels: org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
          build-args: |
            VERSION=dev-${{ github.event.workflow_run.head_sha }}
            COMMIT=${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Update Compose service
    needs: image
    runs-on: ubuntu-24.04
    environment: hexclaw-cloud
    concurrency:
      group: deploy-hexclaw-cloud
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Prepare deployment transport
        env:
          DEPLOY_KEY: ${{ secrets.HEXCLAW_DEPLOY_SSH_KEY }}
          DEPLOY_HOST_KEYS: ${{ secrets.HEXCLAW_DEPLOY_KNOWN_HOSTS }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          os.umask(0o077)
          directory = Path.home() / '.ssh'
          directory.mkdir(exist_ok=True)
          (directory / 'id_ed25519').write_text(os.environ['DEPLOY_KEY'] + '\n')
          (directory / 'known_hosts').write_text(os.environ['DEPLOY_HOST_KEYS'] + '\n')
          PY
      - name: Deploy exact digest
        id: update
        env:
          DEPLOY_HOST: ${{ secrets.HEXCLAW_DEPLOY_HOST }}
          DEPLOY_PROJECT: ${{ secrets.HEXCLAW_DEPLOY_PROJECT }}
          DEPLOY_COMMIT: ${{ github.event.workflow_run.head_sha }}
          DEPLOY_DIGEST: ${{ needs.image.outputs.digest }}
          DEPLOY_RUN: ${{ github.run_id }}
          SOURCE_CI_RUN: ${{ github.event.workflow_run.id }}
        run: |
          python3 - <<'PY'
          import io, json, os, posixpath, shlex, subprocess, tarfile
          from pathlib import Path
          project = os.environ['DEPLOY_PROJECT']
          if not posixpath.isabs(project): raise SystemExit('An absolute deployment project directory is required')
          commit = os.environ['DEPLOY_COMMIT']
          directory = posixpath.join(project, '.hexclaw-deploy-tools', commit)
          stream = io.BytesIO()
          with tarfile.open(fileobj=stream, mode='w') as archive:
              for name in ('backup.py', 'deploy.py'):
                  archive.add('scripts/ops/' + name, arcname=name)
          upload = 'umask 077; mkdir -p -- ' + shlex.quote(directory) + ' && tar -xf - -C ' + shlex.quote(directory)
          uploaded = subprocess.run(['ssh', '--', os.environ['DEPLOY_HOST'], upload], input=stream.getvalue(), capture_output=True)
          if uploaded.returncode:
              raise SystemExit('Deployment tools upload failed; inspect the private target connection')
          args = ['python3', directory + '/deploy.py', '--project-dir', project,
                  '--target-config', project + '/deployment-target.json',
                  '--image', 'ghcr.io/hexagon-codes/hexclaw@' + os.environ['DEPLOY_DIGEST'],
                  '--commit', commit, '--run-id', os.environ['DEPLOY_RUN']]
          result = subprocess.run(['ssh', '--', os.environ['DEPLOY_HOST'], shlex.join(args)], capture_output=True, text=True)
          if result.returncode:
              message = next((line for line in reversed(result.stderr.splitlines()) if line.startswith(('Deployment failed:', 'Deployment interrupted'))), 'Deployment command failed; inspect the server receipt')
              raise SystemExit(message)
          receipt = json.loads(result.stdout)
          deployed = receipt.get('status') == 'deployed'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('deployed=' + str(deployed).lower() + '\n')
          if not deployed:
              if receipt.get('status') != 'superseded':
                  raise SystemExit('Deployment has no finalized success result')
              print('Deployment superseded; the candidate was not applied')
          else:
              image = 'ghcr.io/hexagon-codes/hexclaw@' + os.environ['DEPLOY_DIGEST']
              if receipt.get('commit') != commit or receipt.get('image') != image or str(receipt.get('actions_run')) != os.environ['DEPLOY_RUN'] or receipt.get('retention_stage'):
                  raise SystemExit('The deployment receipt does not match this operation')
              exported = {key: receipt[key] for key in ('status', 'commit', 'image', 'actions_run')}
              exported.update(source_ci_run_id=os.environ['SOURCE_CI_RUN'], environment='hexclaw-cloud')
              Path('deployment-result.json').write_text(json.dumps(exported) + '\n')
              print('Deployment finalized: ' + commit)
          PY

      - name: Preserve finalized deployment result
        if: steps.update.outputs.deployed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hexclaw-deployment-${{ github.event.workflow_run.head_sha }}
          path: deployment-result.json
          if-no-files-found: error
          overwrite: true
