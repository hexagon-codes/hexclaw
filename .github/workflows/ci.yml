name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOPRIVATE: github.com/hexagon-codes/*

jobs:
  compile:
    name: Compile (feature branch)
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feat/') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # 只构建测试二进制，不执行用例，尽早发现代码与依赖 API 不一致。
      - name: Compile all packages
        run: go test -run '^$' ./...

  test:
    name: Test (Linux)
    if: ${{ github.event_name != 'push' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run tests
        run: go test -race -count=1 ./...

  test-sandbox:
    name: Test (${{ matrix.platform }} Sandbox)
    if: ${{ github.event_name != 'push' || github.ref == 'refs/heads/main' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: Windows
          - os: macos-14
            platform: macOS
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build all
        if: runner.os == 'Windows'
        run: go build ./...

      - name: Run sandbox tests
        run: go test -v -count=1 -timeout 120s ./skill/sandbox/...
