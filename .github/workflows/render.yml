name: render

# 文档渲染管线 CI smoke：三平台跑 render 包测试 + 黄金回归。
# 检查范围见 CONTRIBUTING.md 的 CI/CD 门禁说明。
#
# 触发：
#   - render/ 或 api/handler_render*.go 改动
#   - cmd/hexclaw/main.go 改动

on:
  push:
    branches: [main]
    paths:
      - 'render/**'
      - 'api/handler_render*.go'
      - 'cmd/hexclaw/main.go'
      - '.github/workflows/render.yml'
  pull_request:
    paths:
      - 'render/**'
      - 'api/handler_render*.go'
      - 'cmd/hexclaw/main.go'

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      # 安装 pandoc + typst（与 versions.json pin 的版本一致即可，CI 用 brew/apt 简化）
      - name: Install pandoc + typst (Linux)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          # pandoc：用官方 deb（apt 包版本通常落后）
          curl -fSL https://github.com/jgm/pandoc/releases/download/3.9.0.2/pandoc-3.9.0.2-1-amd64.deb -o /tmp/pandoc.deb
          sudo dpkg -i /tmp/pandoc.deb
          pandoc --version | head -1

          # typst：cargo install 太慢，下载官方二进制
          curl -fSL https://github.com/typst/typst/releases/download/v0.13.1/typst-x86_64-unknown-linux-musl.tar.xz | \
            tar xJ --strip-components=1 -C /usr/local/bin typst-x86_64-unknown-linux-musl/typst
          sudo chmod +x /usr/local/bin/typst
          typst --version

      - name: Install pandoc + typst (macOS)
        if: matrix.os == 'macos-14'
        run: |
          brew install pandoc typst
          pandoc --version | head -1
          typst --version

      - name: Install pandoc + typst (Windows)
        if: matrix.os == 'windows-2022'
        shell: pwsh
        run: |
          choco install -y pandoc typst
          pandoc --version
          typst --version

      - name: Build
        run: go build ./...

      - name: Test render package
        run: go test ./render/... -v -timeout 5m

      - name: Test api render handler
        run: go test ./api/... -run "Render" -v -timeout 5m
