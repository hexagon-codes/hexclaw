<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc" data-generator="fireworks-tech-graph" data-quality-profile="showcase">
<title id="title">HexClaw · Agent workflow</title><desc id="desc">Input loads the session and context before Agent reasoning and planning. Models return responses; the Agent invokes Skills, MCP tools, or scenario capabilities as needed. Tool results feed back to the Agent. Completed tasks assemble results, persist run records, and deliver the output.</desc>
