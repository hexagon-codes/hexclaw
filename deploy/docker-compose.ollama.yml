# 与仓库根 docker-compose.yml 合并；HexClaw 中选择 http://ollama:11434 自定义目标。
services:
  ollama:
    image: ollama/ollama:0.34.0
    volumes:
      - ollama-data:/root/.ollama
    environment:
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
    restart: unless-stopped
volumes:
  ollama-data:
